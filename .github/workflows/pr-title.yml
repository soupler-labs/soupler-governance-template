name: PR Title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main, develop]

permissions:
  contents: read

jobs:
  title:
    name: PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Title is a Conventional Commit (promotion PRs start with release)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" = "develop" ]; then
            echo "$PR_TITLE" | grep -Eq '^release(\(.+\))?: .+' || { echo "::error::develop -> main titles must start with 'release:' (got: $PR_TITLE)"; exit 1; }
          else
            echo "$PR_TITLE" | grep -Eq '^(feat|fix|docs|chore|tech|infra|refactor|test|ci|build|perf)(\([a-z0-9._/-]+\))?!?: .+' \
              || { echo "::error::PR title must be a Conventional Commit: type(scope): description (got: $PR_TITLE)"; exit 1; }
          fi
