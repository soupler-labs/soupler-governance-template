name: CI

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: Documentation Governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash bin/statutory-integrity.sh
      - run: bash bin/governance-strict-audit.sh

  project-quality:
    name: Project Quality Placeholder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run package checks when package.json exists
        run: |
          if [ -f package.json ] && command -v corepack >/dev/null 2>&1; then
            corepack enable
            if [ -f pnpm-lock.yaml ]; then
              pnpm install --frozen-lockfile
              pnpm run lint --if-present
              pnpm run typecheck --if-present
              pnpm run test --if-present
              pnpm run build --if-present
            else
              npm ci
              npm run lint --if-present
              npm run typecheck --if-present
              npm test --if-present
              npm run build --if-present
            fi
          else
            echo "No package.json found; skipping project quality checks."
          fi

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Run Gitleaks
        run: gitleaks detect --source . --redact
