name: CI/CD

# Triggers on every PR targeting main or develop.
# Production deploy (push to main) belongs in a separate deploy-production.yml.

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: write

# ─────────────────────────────────────────────────────────────────────────────
# Stage 1 — Parallel checks (all must pass before build)
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-environment  # replace or inline your setup
      - run: pnpm run lint                          # replace with your lint command

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-environment
      - run: pnpm run typecheck                     # replace with your typecheck command

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Run Gitleaks
        run: gitleaks detect --source . --redact
        # Add --config .gitleaks.toml if you have custom allowlists

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-environment
      - run: pnpm run test                          # replace with your test command

# ─────────────────────────────────────────────────────────────────────────────
# Stage 2 — Build (needs all Stage 1 checks green)
# ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, secret-scan, test]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-environment
      - run: pnpm run build                         # replace with your build command

# ─────────────────────────────────────────────────────────────────────────────
# Stage 3 — Preview deploy (optional; remove if not using Vercel)
# ─────────────────────────────────────────────────────────────────────────────
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request'
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-environment
      - name: Deploy
        id: deploy
        run: |
          # Replace the block below with your preview deploy command
          deployment_url=$(npx vercel@latest --token ${{ secrets.VERCEL_TOKEN }} --yes)
          echo "deployment-url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Preview deployment: $deployment_url" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
