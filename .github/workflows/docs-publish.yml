name: Publish Governance Docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "bin/build-docs-site.sh"
      - ".github/workflows/docs-publish.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Docs Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash bin/statutory-integrity.sh
      - run: bash bin/governance-strict-audit.sh
      - run: bash bin/build-docs-site.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/docs

  deploy:
    name: Deploy Docs Site
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
