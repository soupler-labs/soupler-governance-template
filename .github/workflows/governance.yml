name: PR Governance

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  sive:
    name: Statutory Integrity (SIVE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash bin/statutory-integrity.sh

  validate-pr:
    name: PR Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check title and issue reference
        id: check
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "title_ok=false" >> "$GITHUB_OUTPUT"
          echo "body_ok=false"  >> "$GITHUB_OUTPUT"
          # Title format: [PROJECT-123] Short description
          # Customize the regex below to match your project's prefix (e.g. SOUPLER, APP, MYCO)
          echo "$PR_TITLE" | grep -Eq '^\[PROJECT-[0-9]+\] .+' && echo "title_ok=true" >> "$GITHUB_OUTPUT"
          echo "${PR_BODY:-}" | grep -Eiq '(closes|close|fixes|fix|refs|ref)[: ]+#([0-9]+)' && echo "body_ok=true" >> "$GITHUB_OUTPUT"

      - name: Comment when invalid
        if: steps.check.outputs.title_ok == 'false' || steps.check.outputs.body_ok == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const issues = [];
            if ("${{ steps.check.outputs.title_ok }}" === "false")
              issues.push("- Title must follow `[PROJECT-123] Short description`");
            if ("${{ steps.check.outputs.body_ok }}" === "false")
              issues.push("- Body must include `Closes #123` or `Refs #123`");
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### PR validation failed\n\n${issues.join("\n")}\n\nPlease update and push again.`
            });

      - name: Fail when invalid
        if: steps.check.outputs.title_ok == 'false' || steps.check.outputs.body_ok == 'false'
        run: exit 1
